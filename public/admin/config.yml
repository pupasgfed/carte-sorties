backend:
  name: github
  repo: pupasgfed/carte-sorties
  branch: main
  auth_type: oauth
  app_id: ""

# Restrict access to a closed list of collaborators.
# Add GitHub usernames of authorized editors below.
collaborator_auth:
  collaborators:
    - pupasgfed

media_folder: "data/media"
public_folder: "/media"

collections:
  - name: "events"
    label: "Sorties"
    label_singular: "Sortie"
    folder: "data/events"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{id}}"
    editor:
      preview: false
    fields:
      - { name: "id", label: "Identifiant", widget: "string", hint: "Slug unique, utilisé comme nom de fichier." }
      - { name: "title", label: "Titre", widget: "string" }
      - { name: "description", label: "Description", widget: "text", required: false }
      - { name: "date_start", label: "Date de début", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: "date_end", label: "Date de fin", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: "city", label: "Ville", widget: "string" }
      - { name: "lat", label: "Latitude", widget: "number", value_type: "float", step: 0.0001 }
      - { name: "lng", label: "Longitude", widget: "number", value_type: "float", step: 0.0001 }
      - { name: "link", label: "Lien externe", widget: "string", required: false }
      - { name: "image", label: "Image (URL)", widget: "string", required: false, hint: "URL d'une image affichée dans la liste des sorties." }
      - name: "status"
        label: "Statut"
        widget: "select"
        default: "published"
        options:
          - { label: "Publié", value: "published" }
          - { label: "Brouillon", value: "draft" }

  - name: "hypnotists"
    label: "Hypnotistes"
    label_singular: "Hypnotiste"
    folder: "data/hypnotists"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{id}}"
    editor:
      preview: false
    fields:
      - { name: "id", label: "Identifiant", widget: "string", hint: "Slug unique, utilisé comme nom de fichier." }
      - { name: "name", label: "Nom", widget: "string" }
      - { name: "city", label: "Ville", widget: "string" }
      - { name: "department", label: "Département", widget: "string", hint: "Numéro du département français, par exemple 75 ou 69." }
      - { name: "rating", label: "Note", widget: "number", value_type: "int", min: 1, max: 5, step: 1 }
      - { name: "image", label: "Photo principale (URL Imgur)", widget: "string", required: false }
      - { name: "description", label: "Description", widget: "markdown", required: false, hint: "Les deux premières lignes sont utilisées comme résumé dans les cartes." }
      - { name: "lat", label: "Latitude", widget: "number", value_type: "float", step: 0.0001, required: false }
      - { name: "lng", label: "Longitude", widget: "number", value_type: "float", step: 0.0001, required: false }
      - { name: "website", label: "Site web", widget: "string", required: false }
      - { name: "instagram", label: "Instagram", widget: "string", required: false, hint: "Nom du compte, avec ou sans @." }
      - { name: "twitter", label: "Twitter", widget: "string", required: false, hint: "Nom du compte, avec ou sans @." }
      - { name: "phone", label: "Téléphone", widget: "string", required: false }
      - { name: "email", label: "E-mail", widget: "string", required: false }
      - name: "status"
        label: "Statut"
        widget: "select"
        default: "published"
        options:
          - { label: "Publié", value: "published" }
          - { label: "Brouillon", value: "draft" }

  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "data/articles"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { name: "title", label: "Titre", widget: "string" }
      - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: "author", label: "Auteur", widget: "string" }
      - name: "categories"
        label: "Catégories"
        widget: "list"
        required: false
        field: { name: "category", label: "Catégorie", widget: "string" }
      - { name: "excerpt", label: "Extrait", widget: "text", required: false, hint: "Court résumé affiché dans la liste des articles." }
      - { name: "cover", label: "Image de couverture (URL)", widget: "string", required: false }
      - name: "status"
        label: "Statut"
        widget: "select"
        default: "published"
        options:
          - { label: "Publié", value: "published" }
          - { label: "Brouillon", value: "draft" }
      - { name: "body", label: "Contenu", widget: "markdown" }
